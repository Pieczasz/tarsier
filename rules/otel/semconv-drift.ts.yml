id: otel-semconv-drift-ts
language: typescript
severity: info

metadata:
  rule: otel/semconv-drift
  requires: attributes
  expectation_layer: "2"
  confidence: medium
  spec_ref: otel/semconv-http-migration

message: "Deprecated OTel HTTP attribute name; TraceQL/PromQL joins break across SDK versions."
note: |
  Prefer the stable HTTP semantic conventions
  (https://opentelemetry.io/docs/specs/semconv/http/migration-guide/):

    http.method       -> http.request.method
    http.status_code  -> http.response.status_code
    http.target       -> url.path (+ url.query)
    http.url          -> url.full
    http.scheme       -> url.scheme
    http.host         -> server.address (+ server.port)
    net.host.name     -> server.address
    http.user_agent   -> user_agent.original

  Flagged when @opentelemetry/api or @opentelemetry/semantic-conventions
  is imported and a deprecated key appears as a string literal. Confidence
  is medium (TAR-77): string-literal matches can FP on non-attribute uses;
  promote to high only after corpus precision evidence (see docs/PRECISION.md).

rule:
  any:
    - pattern: "'http.method'"
    - pattern: '"http.method"'
    - pattern: "'http.status_code'"
    - pattern: '"http.status_code"'
    - pattern: "'http.target'"
    - pattern: '"http.target"'
    - pattern: "'http.url'"
    - pattern: '"http.url"'
    - pattern: "'http.scheme'"
    - pattern: '"http.scheme"'
    - pattern: "'http.host'"
    - pattern: '"http.host"'
    - pattern: "'net.host.name'"
    - pattern: '"net.host.name"'
    - pattern: "'net.peer.name'"
    - pattern: '"net.peer.name"'
    - pattern: "'http.user_agent'"
    - pattern: '"http.user_agent"'
  all:
    - inside:
        stopBy: end
        kind: program
        has:
          stopBy: end
          kind: import_statement
          has:
            field: source
            regex: '@opentelemetry/(api|semantic-conventions)'
