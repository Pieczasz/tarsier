id: logs-missing-trace-correlation-go
language: go
severity: warning

metadata:
  rule: logs/missing-trace-correlation
  requires: log_correlation
  expectation_layer: "2"
  confidence: medium
  spec_ref: instrumentation-score/LOG-001

message: "Structured logger is used alongside OTel without a log<->trace bridge."
note: |
  Without trace_id/span_id on log records, logs cannot join traces. When this
  module already imports go.opentelemetry.io/otel and log/slog (or zap), wire
  go.opentelemetry.io/contrib/bridges/otelslog (or otelzap) - do not call the
  Logs Bridge API from application code.

  Precision ceiling: a bridge registered in another package is invisible.
  Confidence is medium; demote to advisory if corpus FP rate is bad.

rule:
  kind: call_expression
  all:
    - has:
        field: function
        regex: '^slog\.(New|NewJSONHandler|NewTextHandler)$'
    - inside:
        stopBy: end
        kind: source_file
        has:
          stopBy: end
          kind: import_spec
          regex: 'go\.opentelemetry\.io/otel'
    - inside:
        stopBy: end
        kind: source_file
        has:
          stopBy: end
          kind: import_spec
          regex: '"log/slog"'
    - not:
        inside:
          stopBy: end
          kind: source_file
          has:
            stopBy: end
            kind: import_spec
            regex: '(otelslog|otelzap|bridges/otel)'
