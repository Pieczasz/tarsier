    - source: |-
        if err := reserve(); err != nil {
                _ = err
            }
      style: primary
      start: 28
      end: 83
    - source: err != nil
      style: secondary
      start: 49
      end: 59
    - source: |-
        {
                _ = err
            }
      style: secondary
      start: 60
      end: 83
