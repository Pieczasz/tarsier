id: otel-sdk-missing-resource-attrs-ts
valid:
  # ATTR_SERVICE_NAME in the constructor - the correct shape.
  - |
    import { NodeSDK } from "@opentelemetry/sdk-node";
    import { ATTR_SERVICE_NAME } from "@opentelemetry/semantic-conventions";
    export const sdk = new NodeSDK({ resource: { [ATTR_SERVICE_NAME]: "web" } });
  # service.name string key.
  - |
    import { NodeSDK } from "@opentelemetry/sdk-node";
    export const sdk = new NodeSDK({ resource: { "service.name": "web" } });
  # Same-file auto-instrumentations-node: detectors may set service.name.
  - |
    import { NodeSDK } from "@opentelemetry/sdk-node";
    import { getNodeAutoInstrumentations } from "@opentelemetry/auto-instrumentations-node";
    export const sdk = new NodeSDK({});
  # No sdk-node import.
  - |
    export const sdk = new NodeSDK({});
invalid:
  - |
    import { NodeSDK } from "@opentelemetry/sdk-node";
    export const sdk = new NodeSDK({});
