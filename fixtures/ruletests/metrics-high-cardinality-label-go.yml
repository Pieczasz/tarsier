id: metrics-high-cardinality-label-go
valid:
  - |
    var good = prometheus.NewCounterVec(prometheus.CounterOpts{}, []string{"status", "region"})
  # A plain string slice is not a metric label set.
  - |
    var notAMetric = []string{"user_id"}
  # tenant_id is usually bounded and is often the label you want.
  - |
    var tenant = prometheus.NewCounterVec(prometheus.CounterOpts{}, []string{"tenant_id"})
  # attribute.String without the OTel attribute import is some other helper.
  - |
    package p
    func f(userID string) { _ = attribute.String("user_id", userID) }
  - |
    package p
    import "go.opentelemetry.io/otel/attribute"
    func f(status string) { _ = attribute.String("status", status) }
  # Span attributes may be high-cardinality; that is free on traces.
  - |
    package p
    import "go.opentelemetry.io/otel/attribute"
    func f(span interface{ SetAttributes(...attribute.KeyValue) }, id string) {
      span.SetAttributes(attribute.String("request_id", id))
    }
invalid:
  - |
    var bad = prometheus.NewCounterVec(prometheus.CounterOpts{}, []string{"user_id", "status"})
  - |
    var bad2 = promauto.NewHistogramVec(prometheus.HistogramOpts{}, []string{"email"})
  - |
    package p
    import (
      "context"
      "go.opentelemetry.io/otel/attribute"
      "go.opentelemetry.io/otel/metric"
    )
    func f(ctx context.Context, c metric.Int64Counter, userID string) {
      c.Add(ctx, 1, metric.WithAttributes(attribute.String("user_id", userID)))
    }
  - |
    package p
    import (
      "context"
      "go.opentelemetry.io/otel/attribute"
      "go.opentelemetry.io/otel/metric"
    )
    func f(ctx context.Context, c metric.Int64Counter, userID, status string) {
      c.Add(ctx, 1, metric.WithAttributes(
        attribute.String("user_id", userID),
        attribute.String("status", status),
      ))
    }
