id: metrics-high-cardinality-label-ts
language: typescript
severity: warning

metadata:
  rule: metrics/high-cardinality-label
  requires: bounded_cardinality
  expectation_layer: "2"
  confidence: high
  spec_ref: instrumentation-score/MET-001

message: "Metric label $LABEL is unbounded; each distinct value mints a new billable time series."
note: |
  Unbounded labels are the single largest driver of observability cost.
  Drop the label, or replace it with a bounded dimension (status, route,
  region). If you need per-user detail, put it on a span or an exemplar -
  high cardinality is free on traces and ruinous on metrics.

rule:
  any:
    - all:
        - kind: string
          pattern: $LABEL
          matches: is-unbounded-label
        - inside:
            stopBy: end
            kind: array
            inside:
              stopBy: end
              kind: pair
              has:
                field: key
                regex: '^labelNames$'

    - all:
        - kind: property_identifier
          pattern: $LABEL
          matches: is-unbounded-label
        - inside:
            kind: pair
            inside:
              kind: object
              inside:
                kind: arguments
                inside:
                  pattern: $METER.$METHOD($VALUE, $ATTRS)
        - inside:
            stopBy: end
            kind: program
            has:
              stopBy: end
              kind: import_statement
              has:
                field: source
                regex: '@opentelemetry'

constraints:
  METHOD:
    regex: '^(add|record)$'
