id: metrics-unbounded-label-value-python
language: python
severity: warning

metadata:
  rule: metrics/unbounded-label-value
  requires: bounded_cardinality
  expectation_layer: "2"
  confidence: high
  spec_ref: instrumentation-score/MET-001

message: "Metric label value $VAL is unbounded."
note: |
  A label with an innocent name still mints a series per request when its
  value is unbounded:

    failures = Counter("orders_failed_total", "Failures.", ["error"])
    failures.labels(str(exc)).inc()

  Bucket the value into something bounded before it reaches the label - an
  error class, a route template, a status code - and put the full detail on a
  span, where cardinality is free.

rule:
  any:
    - all:
        - pattern: $R.path
        - pattern: $VAL
    - all:
        - pattern: traceback.format_exc()
        - pattern: $VAL
    - all:
        - kind: call
          has:
            field: function
            regex: '(^|\.)uuid4$'
        - pattern: $VAL

  inside:
    stopBy: end
    kind: argument_list
    inside:
      kind: call
      has:
        field: function
        regex: '\.labels$'
