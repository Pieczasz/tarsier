id: otel-sdk-missing-shutdown-ts
language: typescript
severity: warning

metadata:
  rule: otel/sdk-missing-shutdown
  requires: resource
  expectation_layer: "2"
  confidence: medium
  spec_ref: otel-sdk-shutdown

message: "NodeSDK is constructed without shutdown()/forceFlush() in this file."
note: |
  Process exit before SDK flush drops buffered spans. Fix: await sdk.shutdown()
  on SIGTERM / before process.exit.

  Confidence is medium: shutdown in another module is invisible. Demote if
  corpus FP rate is bad.

rule:
  kind: new_expression
  all:
    - has:
        field: constructor
        regex: 'NodeSDK'
    - inside:
        stopBy: end
        kind: program
        has:
          stopBy: end
          kind: import_statement
          has:
            field: source
            regex: '@opentelemetry/sdk-node'
    - not:
        inside:
          stopBy: end
          kind: program
          has:
            stopBy: end
            regex: '\.shutdown\s*\(|\.forceFlush\s*\('
