id: otel-sdk-missing-resource-attrs-go
language: go
severity: warning

metadata:
  rule: otel/sdk-missing-resource-attrs
  requires: resource
  expectation_layer: "2"
  confidence: high
  spec_ref: instrumentation-score/RES-001

message: "OTel resource is created without service.name, so backends cannot attribute this process."
note: |
  Instrumentation Score RES-001 is Critical: every process must set
  service.name (and preferably service.version / deployment.environment).
  Without it, traces, metrics and logs from this binary land as
  "unknown_service" and cannot join a checkout journey.

  Fix: resource.New(ctx, resource.WithAttributes(semconv.ServiceName("api")))
  or resource.WithFromEnv() when OTEL_SERVICE_NAME is set.

  Ceiling: an aliased resource import is a miss. service.name set only in
  a sibling file, a Dockerfile, or OTEL_SERVICE_NAME with no WithFromEnv
  is invisible. NewTracerProvider without a Resource option is out of
  scope for v1. See README 13.2.

rule:
  kind: call_expression
  all:
    - has:
        field: function
        regex: '^resource\.New$'
    - not:
        has:
          stopBy: end
          regex: '(ServiceName|WithFromEnv|OTEL_SERVICE_NAME)'
    - inside:
        stopBy: end
        kind: source_file
        has:
          stopBy: end
          kind: import_spec
          regex: 'go\.opentelemetry\.io/otel/sdk/resource'
